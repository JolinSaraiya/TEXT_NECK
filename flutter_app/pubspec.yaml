name: flutter_app
description: AI posture detection application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  camera: ^0.11.0
  google_mlkit_pose_detection: ^0.12.0
  fl_chart: ^1.2.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^6.1.5
  google_fonts: ^8.2.0
  pdf: ^3.11.0
  printing: ^5.13.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/posture_guide_correct.jpg
    - assets/images/posture_guide_wrong.jpg
